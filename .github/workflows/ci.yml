name: Continuous Integration

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 🧹 Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install Dependencies
        run: uv sync --all-extras --dev

      - name: Ruff Lint
        run: uv run ruff check --output-format=github .

      - name: Ruff Format Check
        run: uv run ruff format --check .

  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: webrenting_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d webrenting_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install Dependencies
        run: uv sync --all-extras --dev

      - name: Run Test Suite
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5433/webrenting_test
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5433/webrenting_test
          REDIS_URL: redis://localhost:6379/0
#          TEST_REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ${{ secrets.TEST_SECRET_KEY }}
        run: uv run pytest -v

  docker:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs:
      - quality
      - test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: webrenting:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  migrations:
    name: 🗄️ Database Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: webrenting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d webrenting_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install Dependencies
        run: uv sync --all-extras --dev

      - name: Run Alembic Migrations
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/webrenting_test
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: uv run alembic upgrade head

      - name: Verify Migration Head
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/webrenting_test
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: uv run alembic current
