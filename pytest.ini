[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
addopts = -m "not future"
markers =
    future: Tests for domains or integrations that are not yet implemented
    auth: Authentication and authorization tests
    users: User domain tests
    properties: Property domain tests
    bookings: Booking domain tests
    payments: Payment domain tests
    subscriptions: Subscription domain tests
    messaging: Messaging domain tests
    notifications: Notification domain tests
    reviews: Review tests
    search: Search and saved-search tests
    analytics: Analytics tests
    media: Media tests
    admin: Admin and moderation tests
    integrations: External integration tests
