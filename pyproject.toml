# pyproject.toml

[project]
name = "webrenting"
version = "0.1.0"
description = "A production-ready real estate rental platform built with FastAPI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [
    { name = "Godwin Sun", email = "godwinemerald288@gmail.com" },
]

dependencies = [
    # Core
    "fastapi[standard]>=0.115,<1.0",
    # Database
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "psycopg[binary]>=3.3,<4.0",
    "greenlet>=3.5,<4.0",
    # Auth & Security
    "bcrypt>=5.0,<6.0",
    "passlib>=1.7,<2.0",
    "PyJWT>=2.10,<3.0",
    "cryptography>=48.0,<49.0",
    # Settings
    "pydantic-settings>=2.7,<3.0",
    "python-dotenv>=1.2,<2.0",
    # Cache
    "redis>=8.0,<9.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0,<5.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.9,<1.0",
    "mypy>=1.14,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ─── Ruff ─────────────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
# FastAPI Depends() pattern — framework convention, not a bug
"app/domains/*/router.py" = ["B008"]
"app/core/dependencies.py" = ["B008"]
# Auto-generated migration files — don't lint them
"alembic/versions/*" = ["E501"]
# Test files and utility scripts
"tests/**" = ["E501", "F841"]
"test_db_connection.py" = ["E501"]
"verify_db.py" = ["E501", "W291", "W293"]
# Generic syntax (str, enum.Enum) — batch migrate to StrEnum later
"app/domains/*/models.py" = ["UP042"]
"app/shared/schemas.py" = ["UP042", "UP046"]
# try/except/pass for Redis cache warmup — intentional fire-and-forget
"app/permissions/guards.py" = ["SIM105", "B008"]
# Lambda is cleaner here than a def
"app/core/event_loop.py" = ["E731"]
# raise within except — auth service intentionally replaces exception type
"app/domains/auth/service.py" = ["B904"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ─── mypy ─────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

# ─── pytest ───────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
