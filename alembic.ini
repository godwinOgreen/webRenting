# alembic.ini

[alembic]
# Migration scripts location (relative to this file).
script_location = alembic

# Database URL is NOT set here — it's read from app.core.config in env.py.
# This prevents credentials from being committed to version control.
# sqlalchemy.url = driver://user:pass@localhost/dbname

# Timezone for migration file timestamps.
timezone = UTC

# File template for migration filenames.
# %(rev)s = short hash, %(slug)s = sanitized message, %(year)s etc. = timestamp
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Truncate long slug names to this length.
truncate_slug_length = 40

# Encoding for migration files.
output_encoding = utf-8

# Logging configuration — useful for debugging migration generation.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S